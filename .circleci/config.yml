
version: 2.1

parameters:
  machine:
    type: boolean
    default: false
jobs:
  second-job:
    docker:
      - image: cimg/base:stable
    steps:
      - run: echo "hello"

  connector:
    type: no-op
      
  say-hello:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Say hello"
          command: "echo Hello, World!"

workflows:
  say-hello-workflow:
    jobs:
      - connector
      - second-job:
          requires:
            - say-hello:
                 - success
      - say-hello:
          filters: not pipeline.parameters.machine
  

      
